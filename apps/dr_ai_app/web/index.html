<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Invited, synthetic-data-only Dr. AI beta for doctor web and patient mobile workflow validation.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dr. AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dr. AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f8f9ff;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      background: #f8f9ff;
      color: #171a2b;
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
      transition: opacity 180ms ease-out;
    }

    #app-loading.is-ready {
      opacity: 0;
      pointer-events: none;
    }

    .app-loading-content {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .app-loading-mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border-radius: 18px;
      background: #17157c;
      color: #ffffff;
      font-size: 25px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgb(23 21 124 / 18%);
    }

    .app-loading-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .app-loading-progress {
      width: 96px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: #dedff3;
    }

    .app-loading-progress::after {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #5553c8;
      content: "";
      animation: app-loading-slide 1.1s ease-in-out infinite;
    }

    @keyframes app-loading-slide {
      from { transform: translateX(-110%); }
      to { transform: translateX(235%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading { transition: none; }
      .app-loading-progress::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Loading Dr. AI">
    <div class="app-loading-content">
      <div class="app-loading-mark" aria-hidden="true">Dr</div>
      <div class="app-loading-title">Dr. AI</div>
      <div class="app-loading-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('app-loading');
      if (!loading) return;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          loading.classList.add('is-ready');
          setTimeout(function () { loading.remove(); }, 200);
        });
      });
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
