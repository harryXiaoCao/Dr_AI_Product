services:
  api:
    image: ${DR_AI_IMAGE:?Set DR_AI_IMAGE to the immutable staging image}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DR_AI_STAGING_HOST: ${DR_AI_STAGING_HOST:?Set the approved staging hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/dr-ai-web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
