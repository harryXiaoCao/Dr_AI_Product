[project]
name = "dr-ai-retrieval-inference"
version = "0.1.0"
description = "Private CPU embedding and reranking service for Dr. AI retrieval."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=2.2,<3.0",
  "onnxruntime>=1.22,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "torch>=2.6,<3.0",
  "transformers>=4.51,<5.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
